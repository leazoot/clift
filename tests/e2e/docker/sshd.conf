# Public key only: the fixture never has a password to leak, and a test that
# could fall back to one would stop proving that key based auth works.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers dev
# Lets a test advertise environment variables through ~/.ssh/environment, which
# is how the XDG_CACHE_HOME path of the inbox resolution gets exercised against
# a real sshd rather than only against a fake.
PermitUserEnvironment yes

# VERBOSE so that sshd logs one line per session start:
#   Starting session: subsystem 'sftp' for dev from ... id N
# That line is the only server-side count of how many sftp-server subsystems
# were started, which is what the session tests assert on. A client-side count
# would be the client's own word for it.
LogLevel VERBOSE

Subsystem sftp /usr/lib/openssh/sftp-server
